<div id="ov"><h1>빗속의 저택</h1>
<p>창밖엔 비가 내린다. 이 방 안은 안전하지만, 문 밖의 거대한 저택에는 ‘그것’이 돌아다닌다.</p>
<p>사물함에서 열쇠 2개, 특별한 방(레스토랑·응접실·의료실)에서 망치 2개를 찾아 방의 탈출구를 열어라. 목숨은 3개. 달리면 소리가 나고 지친다. 사물함에 숨으면 괴물을 피할 수 있다.</p>
<p style="opacity:.6;font-size:14px">WASD 이동 · Shift 달리기 · 마우스 시점 · E 조사/나가기 · F 손전등 · H 사물함에 숨기 · 소리를 켜고 하세요</p>
